name: Update rocket damage data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public web repository
        uses: actions/checkout@v5

      - name: Checkout private data repository
        uses: actions/checkout@v5
        with:
          repository: clagon/fetch-cr-data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: data-repo

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            data-repo/package-lock.json

      - name: Install data generator dependencies
        working-directory: data-repo
        run: npm ci

      - name: Generate JSON
        working-directory: data-repo
        run: |
          if ! npm run generate -- --out ../src/lib/data/rocket-damage.json; then
            if [ -f ../src/lib/data/rocket-damage.json ]; then
              echo "::warning::Asset fetch failed; keeping existing rocket damage JSON."
            else
              echo "::error::Asset fetch failed and no existing rocket damage JSON is available."
              exit 1
            fi
          fi

      - name: Install web dependencies
        run: npm ci

      - name: Check web build
        run: npm run check && npm run build

      - name: Commit updated JSON
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Update rocket damage data"
          file_pattern: src/lib/data/rocket-damage.json
